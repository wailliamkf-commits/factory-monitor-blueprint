[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-monitor-desktop"
version = "0.2.0"
description = "Local desktop alerts and measured device/model adaptation for Factory Monitor"
requires-python = ">=3.12,<3.14"
dependencies = ["factory-monitor==0.1.0", "PySide6>=6.8,<7", "httpx>=0.27,<1", "psutil>=6,<8", "Pillow>=11,<13"]

[project.scripts]
factory-monitor-desktop = "factory_monitor_desktop.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
